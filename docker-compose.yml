# Local databases: docker compose up -d mongo mysql
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: creatign_ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mongo-data:
  mysql-data:
