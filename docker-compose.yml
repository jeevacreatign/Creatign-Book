# Local MySQL for Creatign Ledger: docker compose up -d mysql
# Matches DATABASE_URL in .env.example. Change the passwords for anything other than local development.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: creatign_ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
